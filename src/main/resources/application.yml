spring:
  application:
    name: organizacao-recursos
  datasource:
    url: ${DATABASE_URL:jdbc:postgresql://localhost:5432/organizacao_recursos}
    username: ${DATABASE_USER:recursos}
    password: ${DATABASE_PASSWORD:recursos_local}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mvc:
    problemdetails:
      enabled: true

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      show-details: never

notificacao:
  # RF-11: serviço externo de notificação (simulado com WireMock nos testes).
  url: ${NOTIFICACAO_URL:http://localhost:8089/notificacoes}
  timeout: ${NOTIFICACAO_TIMEOUT:2s}

server:
  error:
    include-message: never
    include-stacktrace: never

