services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-organizacao_recursos}
      POSTGRES_USER: ${POSTGRES_USER:-recursos}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-recursos_local}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-recursos} -d ${POSTGRES_DB:-organizacao_recursos}"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data

volumes:
  postgres-data:

