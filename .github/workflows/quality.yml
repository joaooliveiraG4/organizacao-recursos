name: qualidade

on:
  pull_request:
  push:
    branches: [main]
    # Release candidate: o run fica ligado à tag (ex.: v1.0.0-rc1) para servir de evidência.
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: build-test-coverage
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - name: Obter código
        uses: actions/checkout@v4
        with:
          # Histórico completo para o SonarCloud identificar o código novo da PR.
          fetch-depth: 0

      - name: Configurar Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven

      - name: Executar verificação completa
        run: mvn -B clean verify

      - name: Validar avaliador de disputa (fixtures sinteticas)
        shell: pwsh
        run: ./performance/testar-avaliador.ps1

      # Envia a análise com o relatório do JaCoCo. Fica desligada até existir o
      # segredo SONAR_TOKEN e a análise automática ser desativada no SonarCloud.
      # Espera o resultado do Quality Gate: gate reprovado deixa o CI vermelho.
      - name: Analisar no SonarCloud com cobertura
        # Na tag, o mesmo commit já foi analisado pelo push na main.
        if: env.SONAR_TOKEN != '' && !startsWith(github.ref, 'refs/tags/')
        run: mvn -B sonar:sonar -Dsonar.qualitygate.wait=true

      - name: Publicar relatórios
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: relatorios-${{ github.run_number }}
          path: |
            target/surefire-reports/
            target/failsafe-reports/
            target/site/jacoco/
          if-no-files-found: warn
          retention-days: 14

